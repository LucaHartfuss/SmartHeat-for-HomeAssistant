name: Release Gateway
# Tag gateway-vX.Y.Z (Spec SHG G2b-1 7, Plan-Praezisierung 8). Zwei Jobs, damit der Signierschluessel nie neben
# Fremdcode laeuft (Dockerfile-Schritte, Basis-Images, pip, Repo-Skripte):
#   build: CI -> Freigabe -> Image multi-arch -> Bundle; KEINE Environment, KEINE Secrets. -dryrun: lokale Registry
#          (Workflow-Dienst), Wegwerf-Schluessel mit Passwort, derselbe Signier-Code wie der echte Release; kein Push
#          nach ghcr, kein Release, main bleibt.
#   sign:  nur beim echten Release; Environment "release" mit den Secrets; prueft das Bundle per Neubau aus dem Tag
#          (gateway/release/verify_bundle.py ueber sign_bundle.sh), signiert, prueft die Signatur, zieht main per
#          Fast-Forward nach und legt das GitHub-Release an.
# Python-Pakete beider Jobs nur aus der Hash-Lock-Datei gateway/release/requirements.txt (--require-hashes).
on:
  push:
    tags: ["gateway-v*"]
concurrency:
  group: release-gateway-${{ github.repository }}
  cancel-in-progress: false
env:
  KIND: gateway
  SELF: SmartHeat-for-HomeAssistant
  IMAGE: ghcr.io/lucahartfuss/smartheat-gateway
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
  build:
    needs: ci
    # Kein "environment:" und keine Signier-Secrets in diesem Job.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      dryrun: ${{ steps.gate.outputs.dryrun }}
      title: ${{ steps.gate.outputs.title }}
      version: ${{ steps.version.outputs.version }}
    services:
      # Nur fuer -dryrun genutzt (localhost:5000); Multi-Arch-Index-Digest wie in tests/test_gateway_updater.sh.
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: tools/ aus dem Root-Repo holen
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: bash scripts/ci/siblings.sh "$RUNNER_TEMP/dev" "$SELF" "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME"
      # release_gate.py braucht PyYAML; build_bundle.py und smartheat_host.minisign zusaetzlich cryptography.
      - run: pip install --require-hashes -r gateway/release/requirements.txt
      - run: mkdir -p "$RUNNER_TEMP/out"
      - name: Freigabe pruefen
        id: gate
        run: >-
          python "$DEV_ROOT/tools/release_gate.py" --kind "$KIND" --repo "$GITHUB_WORKSPACE"
          --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --main-ref origin/main --notes-out "$RUNNER_TEMP/out/notes.md"
      - name: Version aus dem Tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#gateway-v}"
          echo "version=${v%-dryrun}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Host-Netz, damit der Builder die Job-Registry unter localhost:5000 erreicht (nur -dryrun).
          driver-opts: network=host
      - name: Bei ghcr anmelden
        if: steps.gate.outputs.dryrun == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Image bauen und pushen
        id: image
        env:
          DRYRUN: ${{ steps.gate.outputs.dryrun }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          target="$IMAGE"
          [ "$DRYRUN" = true ] && target="localhost:5000/smartheat-gateway"
          docker buildx build --platform linux/amd64,linux/arm64 -f gateway/Dockerfile --push \
            -t "$target:$VERSION" --metadata-file "$RUNNER_TEMP/meta.json" .
          digest="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' \
            "$RUNNER_TEMP/meta.json")"
          echo "ref=$target@$digest" >> "$GITHUB_OUTPUT"
      - name: Bundle bauen
        env:
          REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.version.outputs.version }}
          PYTHONPATH: gateway/host:gateway/src
        run: >-
          python gateway/release/build_bundle.py
          --compose gateway/compose/docker-compose.yml --mosquitto-conf gateway/compose/mosquitto.conf
          --image "$REF" --version "$VERSION" --out "$RUNNER_TEMP/out/bundle"
      - name: Probelauf - Bundle mit Wegwerf-Schluessel signieren und pruefen
        if: steps.gate.outputs.dryrun == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          bash gateway/release/sign_bundle.sh "$RUNNER_TEMP/out/bundle" "$VERSION" "$RUNNER_TEMP/test.pub" --dryrun
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gateway-bundle
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          # Der Job sign wartet auf die Freigabe der Environment "release" (Pflicht-Reviewer).
          retention-days: 7
      - name: Probelauf-Hinweis
        if: steps.gate.outputs.dryrun == 'true'
        run: >-
          echo "::notice::Probelauf gruen - kein Push nach ghcr, kein Release, main unveraendert.
          Tag jetzt loeschen (Runbook 'Probelauf')."
  sign:
    needs: build
    if: needs.build.outputs.dryrun == 'false'
    # Nur dieser Job sieht die Signier-Secrets (Environment "release") und schreibt (main per Fast-Forward, Release).
    # Er fuehrt nur Skripte aus dem getaggten Commit aus; das Bundle aus dem Artefakt ist Daten: sign_bundle.sh baut es
    # mit build_bundle.py aus diesem Checkout und dem Gateway-Digest aus dem Manifest neu und signiert nur bei
    # byte-gleichem Ergebnis (verify_bundle.py; Python-Schritte ohne die Secrets im Environment).
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r gateway/release/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gateway-bundle
          path: ${{ runner.temp }}/out
      - name: Bundle per Neubau pruefen, signieren und gegen release.pub verifizieren
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash gateway/release/sign_bundle.sh "$RUNNER_TEMP/out/bundle" "$VERSION" gateway/host/release.pub
      - name: main per Fast-Forward nachziehen
        run: git push origin "$GITHUB_SHA:refs/heads/main"
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.build.outputs.title }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME existiert bereits"; exit 0
          fi
          bundle="$RUNNER_TEMP/out/bundle"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/out/notes.md" \
            "$bundle/docker-compose.yml" "$bundle/mosquitto.conf" "$bundle/manifest.json" "$bundle/manifest.json.minisig"
