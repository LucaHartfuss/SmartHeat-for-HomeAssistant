name: Release Gateway
# Tag gateway-vX.Y.Z. Das Gateway-Release wird am Betreiberrechner gebaut, signiert und per scp in die eigene Ablage
# geladen (gateway/release/release_lokal.sh, Runbook Gateway-Release); die CI baut und signiert nichts fuer ein Release
# und hat kein Signier-Secret. Sie prueft nur:
#   ci:    volle Stufe (Docker, Real-HA-Container-Tests).
#   probe: Probelauf mit release_lokal.sh --probe und einer Wegwerf-Kette (ca.py test-kette): Image bauen, Bundle bauen
#          und per Neubau pruefen, signieren, Signatur pruefen; kein Upload. Fuehrt Repo-Code aus, daher nur Leserecht,
#          keine Environment, keine Secrets. Laeuft bei echten und bei -dryrun-Tags gleich.
#   main:  nach ci und probe, hinter der Freigabe der Environment "release" (Pflicht-Reviewer, Runbook H-1): Signatur des
#          Tags pruefen (zweite Linie neben dem Tag-Ruleset), Gate (tools/release_gate.py), main per Fast-Forward
#          nachziehen, Release-Notiz ohne Dateien anlegen. Im -dryrun nur Tag-Pruefung und Gate, main bleibt.
# Ein Werks-Image gibt es in der CI nicht mehr (Nutzer-Entscheidung FR-26: der Bau kommt lokal, AP-05a).
# Python-Pakete nur aus Hash-Lock-Dateien (--require-hashes); der Job mit Schreibrecht installiert nur das Lock des Gates.
on:
  push:
    tags: ["gateway-v*"]
concurrency:
  group: release-gateway-${{ github.repository }}
  cancel-in-progress: false
env:
  KIND: gateway
  SELF: SmartHeat-for-HomeAssistant
jobs:
  ci:
    # Volle Stufe (Docker, Real-HA-Container-Tests); der Push-Lauf faehrt nur die Standardstufe.
    uses: ./.github/workflows/ci.yml
    with:
      stufe: voll
    secrets: inherit
    permissions:
      contents: read
  probe:
    needs: ci
    # Kein "environment:" und keine Secrets in diesem Job.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # build_bundle.py braucht PyYAML; ca.py, signieren.py und smartheat_host.kette cryptography.
      - run: pip install --require-hashes -r gateway/release/requirements.txt
      - name: Version aus dem Tag
        id: version
        run: |
          [[ $GITHUB_REF_NAME =~ ^gateway-v([0-9]+\.[0-9]+\.[0-9]+)(-dryrun)?$ ]] \
            || { echo "::error::Tag $GITHUB_REF_NAME ist keine Gateway-Version"; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Probelauf - Bundle bauen, mit Wegwerf-Kette signieren und pruefen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python gateway/release/ca.py test-kette --aus "$RUNNER_TEMP/kette"
          bash gateway/release/release_lokal.sh "$VERSION" --probe --schluessel "$RUNNER_TEMP/kette/release.key" \
            --zertifikat "$RUNNER_TEMP/kette/release.crt" --roots "$RUNNER_TEMP/kette/root.crt" \
            --aus "$RUNNER_TEMP/out"
  main:
    needs: [ci, probe]
    # Schreibt main per Fast-Forward und legt die Release-Notiz an. Das Environment `release` haelt den Lauf bis zur
    # Freigabe des Reviewers an (Runbook H-1). Dieser Job baut und signiert nichts.
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      # Zweite Linie neben dem Tag-Ruleset (Pflicht-Signatur): SSH-Signatur des Tags gegen .github/allowed_signers aus
      # origin/main. Vor allem anderen, auch vor dem Token-Schritt; die Pruefung kommt bewusst aus diesem Repo, nicht aus
      # dem Root-Repo (siblings.sh klont Root an einem Branch, der wie der Tag heisst).
      - name: Signatur des Tags pruefen
        run: bash scripts/ci/tag_pruefen.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: tools/ aus dem Root-Repo holen
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: bash scripts/ci/siblings.sh "$RUNNER_TEMP/dev" "$SELF" "$GITHUB_WORKSPACE" "$GITHUB_REF_NAME"
      # release_gate.py braucht nur PyYAML; dieser Job hat Schreibrecht, daher nur mit Hashes.
      - run: pip install --require-hashes --no-deps -r "$DEV_ROOT/tools/release/requirements.txt"
      - name: Freigabe pruefen
        id: gate
        run: >-
          python "$DEV_ROOT/tools/release_gate.py" --kind "$KIND" --repo "$GITHUB_WORKSPACE"
          --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --main-ref origin/main --notes-out "$RUNNER_TEMP/notes.md"
      - name: main per Fast-Forward nachziehen
        if: steps.gate.outputs.dryrun == 'false'
        run: git push origin "$GITHUB_SHA:refs/heads/main"
      - name: GitHub-Release anlegen (Notiz ohne Dateien)
        if: steps.gate.outputs.dryrun == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.gate.outputs.title }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME existiert bereits"; exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Probelauf-Hinweis
        if: steps.gate.outputs.dryrun == 'true'
        run: echo "::notice::Probelauf gruen - main unveraendert, kein Release. Tag jetzt loeschen (Runbook 'Probelauf')."
