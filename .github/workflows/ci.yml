name: CI
# Pruefstufen (Root-Runbook Abschnitt 3): Push (alle Branches, oeffentliches Repo ohne
# Minutenkosten) und der Tageslauf fahren die Standardstufe: lint, test ohne Real-HA-Container, addon-lint, contract;
# audit nur im Tageslauf. Docker (Schritt docker, aarch64-Build, Gateway-Image, Host-Installer arm64) und die
# Real-HA-Container-Tests (RUN_REAL_HA_TESTS mit HA_IMAGE) laufen nur in der vollen Stufe: Release-Workflows mit
# stufe: voll oder von Hand per workflow_dispatch -f stufe=voll. Die Pflicht-Checks des Rulesets (lint, test, docker,
# build-aarch64 (heizungsbruecke), addon-lint (heizungsbruecke), contract) bleiben Jobs ohne Job-if: die Stufe sitzt
# auf ihren Docker-Schritten, damit der Push-Lauf sie unter dem aufgeloesten Namen mit success meldet (sonst scheitert
# der Fast-Forward von main mit GH013). tools/tests/test_workflows.py (Root) haelt diese Regeln fest.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      stufe:
        description: "Prüfstufe: standard (Lint, Tests, Contract) oder voll (zusätzlich Docker und Real-HA-Container-Tests)"
        type: string
        required: false
        default: standard
  schedule:
    - cron: "37 3 * * *"
  workflow_call:
    inputs:
      stufe:
        description: "Prüfstufe: standard (Lint, Tests, Contract) oder voll (zusätzlich Docker und Real-HA-Container-Tests)"
        type: string
        required: false
        default: standard
    secrets:
      CROSS_REPO_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'develop' || '' }}
  # HA-Version von client1 (HomeAssistantPapa/.HA_VERSION, tools/ha_version_check.py liest die Zeile); stable nur bei
  # schedule, wo die Real-HA-Container-Tests nicht laufen (nur in der vollen Stufe).
  HA_IMAGE: ${{ github.event_name == 'schedule' && 'ghcr.io/home-assistant/home-assistant:stable' || 'ghcr.io/home-assistant/home-assistant:2026.9.4' }}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e "./heizungsbruecke[dev]" -e "./gateway[dev]"  # pin-check: ungehasht (CI ohne Schreibrecht)
      - run: PYTHON=python bash scripts/check.sh --only lint
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # hypothesis mit Hash-Pin vor der ungehashten Dev-Installation; [dev] nennt es nicht.
      - run: |
          pip install --require-hashes --no-deps --only-binary :all: -r heizungsbruecke/requirements-hypothesis.lock
          pip install -e "./heizungsbruecke[dev]" -e "./gateway[dev]"  # pin-check: ungehasht (CI ohne Schreibrecht)
      # Real-HA-Container-Tests (Docker, HA_IMAGE) nur in der vollen Stufe; sonst ueberspringt pytest sie. Profil von
      # hypothesis je Stufe (heizungsbruecke/tests/conftest.py): schnell 50 Beispiele, fester Seed; voll 500, zufaellig.
      - name: test
        env:
          RUN_REAL_HA_TESTS: ${{ inputs.stufe == 'voll' && '1' || '0' }}
          HYPOTHESIS_PROFILE: ${{ inputs.stufe == 'voll' && 'voll' || 'schnell' }}
        run: PYTHON=python bash scripts/check.sh --only test
  docker:
    # Pflicht-Check: kein Job-if; der Docker-Schritt laeuft nur in der vollen Stufe, sonst meldet der Job success.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      # Der Updater-Test laedt OCI-Archive und startet name@<Index-Digest> ohne Pull: das loest nur der containerd-Speicher auf,
      # den auch das Geraet nutzt (gateway/host/docker-daemon.json).
      - if: inputs.stufe == 'voll'
        name: Docker mit containerd-Speicher wie das Geraet
        run: |
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
      - if: inputs.stufe == 'voll'
        run: bash scripts/check.sh --only docker
      - if: inputs.stufe != 'voll'
        run: echo "Docker nur in der vollen Stufe (Release)"
  build-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        addon: [heizungsbruecke]
    # Pflicht-Check unter dem aufgeloesten Namen: kein Job-if (sonst meldet GitHub den Namen womoeglich unaufgeloest);
    # die Docker-Schritte laufen nur in der vollen Stufe.
    name: build-aarch64 (${{ matrix.addon }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - if: inputs.stufe == 'voll'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - if: inputs.stufe == 'voll'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: inputs.stufe == 'voll'
        env:
          ADDON: ${{ matrix.addon }}
        run: docker buildx build --platform linux/arm64 --tag "ci/$ADDON:arm64" "$ADDON"
  build-gateway:
    # Gateway-Image fuer amd64 und arm64; der Compose-Lauf (amd64) steckt im Job docker.
    # Kein Pflicht-Check: nur in der vollen Stufe.
    if: inputs.stufe == 'voll'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --platform linux/amd64,linux/arm64 -f gateway/Dockerfile .
  install-arm64:
    # Host-Installer auch auf arm64 (QEMU); amd64 laeuft im Job docker (scripts/check.sh).
    # Kein Pflicht-Check: nur in der vollen Stufe.
    if: inputs.stufe == 'voll'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - run: SHG_INSTALL_PLATFORM=linux/arm64 bash tests/test_gateway_install.sh
  addon-lint:
    # Pflicht-Check; die Linter-Action ist eine Container-Action, gehoert aber ausdruecklich zur Standardstufe.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        addon: [heizungsbruecke]
    name: addon-lint (${{ matrix.addon }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2
        with:
          path: "./${{ matrix.addon }}"
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Dev-Root aufbauen
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          SIBLINGS_REF: ${{ github.event_name == 'schedule' && 'develop' || github.ref_name }}
        run: >-
          bash scripts/ci/siblings.sh "$RUNNER_TEMP/dev" SmartHeat-for-HomeAssistant "$GITHUB_WORKSPACE"
          "$SIBLINGS_REF"
          HeizungssteuerungServer SmartHeat-Integration
      - run: pip install --require-hashes -r "$DEV_ROOT/tools/requirements-dev.txt"
      # Check 31 (Telemetrie-Round-Trip zum Server) braucht seit der Datenbankschicht eine Test-PostgreSQL
      - name: Test-PostgreSQL
        run: |
          bash "$DEV_ROOT/HeizungssteuerungServer/scripts/test_pg.sh" start
          echo "SMARTHEAT_TEST_PG_DSN=$(bash "$DEV_ROOT/HeizungssteuerungServer/scripts/test_pg.sh" dsn)" >> "$GITHUB_ENV"
      - run: PYTHON=python bash scripts/check.sh --only contract
  # Scan der Lock-Dateien aller Repos auf bekannte Schwachstellen: nur im geplanten Lauf, hier im
  # oeffentlichen Repo (keine Minuten). Der Server-Lock kommt ueber den Dev-Root; Ausnahmen mit Grund in
  # tools/pip_audit_ausnahmen.txt des Root-Repos.
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Dev-Root aufbauen
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: >-
          bash scripts/ci/siblings.sh "$RUNNER_TEMP/dev" SmartHeat-for-HomeAssistant "$GITHUB_WORKSPACE"
          develop HeizungssteuerungServer
      - run: pip install --require-hashes -r "$DEV_ROOT/tools/requirements-audit.txt"
      - run: bash "$DEV_ROOT/tools/pip_audit.sh" "$DEV_ROOT"
