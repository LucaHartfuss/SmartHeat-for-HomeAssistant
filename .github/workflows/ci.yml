name: CI
on:
  push:
    branches: ["**"]
  schedule:
    - cron: "37 3 * * *"
  workflow_call:
    secrets:
      CROSS_REPO_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'develop' || '' }}
  # Push-Laeufe: HA-Version von client1 (HomeAssistantPapa/.HA_VERSION); taeglich: stable (Spec 2.2).
  HA_IMAGE: ${{ github.event_name == 'schedule' && 'ghcr.io/home-assistant/home-assistant:stable' || 'ghcr.io/home-assistant/home-assistant:2026.4.4' }}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e "./heizungsbruecke[dev]" -e "./gateway[dev]"
      - run: PYTHON=python bash scripts/check.sh --only lint
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e "./heizungsbruecke[dev]" -e "./gateway[dev]"
      - run: RUN_REAL_HA_TESTS=1 PYTHON=python bash scripts/check.sh --only test
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - run: bash scripts/check.sh --only docker
  build-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        addon: [heizungsbruecke, cloudflared_access_mqtt]
    name: build-aarch64 (${{ matrix.addon }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - env:
          ADDON: ${{ matrix.addon }}
        run: docker buildx build --platform linux/arm64 --tag "ci/$ADDON:arm64" "$ADDON"
  build-gateway:
    # Gateway-Image fuer amd64 und arm64 (Spec SHG G2 7.4); der Compose-Lauf (amd64) steckt im Job docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --platform linux/amd64,linux/arm64 -f gateway/Dockerfile .
  addon-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        addon: [heizungsbruecke, cloudflared_access_mqtt]
    name: addon-lint (${{ matrix.addon }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2
        with:
          path: "./${{ matrix.addon }}"
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Dev-Root aufbauen
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          SIBLINGS_REF: ${{ github.event_name == 'schedule' && 'develop' || github.ref_name }}
        run: >-
          bash scripts/ci/siblings.sh "$RUNNER_TEMP/dev" SmartHeat-for-HomeAssistant "$GITHUB_WORKSPACE"
          "$SIBLINGS_REF"
          HeizungssteuerungServer SmartHeat-Integration
      - run: pip install -r "$DEV_ROOT/tools/requirements-dev.txt"
      - run: PYTHON=python bash scripts/check.sh --only contract
