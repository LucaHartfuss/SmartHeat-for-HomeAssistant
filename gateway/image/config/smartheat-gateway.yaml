# SmartHeat-Gateway-Image (Plan G2b-2 Task 9), rpi-image-gen v2.8.0 (Commit 262d4df, gepinnt in build.sh). Aufbau
# wie das mitgelieferte config/trixie-minbase.yaml, Geraet Raspberry Pi 4 mit SSD am USB. /stage stellt build.sh
# bereit (Inhalt von prepare.sh).
device:
  layer: rpi4
  # sd statt usb: v2.8.0 nimmt usb im Geraete-Layer an, die Pruefung der Image-Beschreibung (IDP-Schema v2, post-image)
  # kennt aber nur sd/emmc/nvme und bricht den Bau ab (CI-Spike 2026-10-07). Der Wert geht nur in diese Beschreibung
  # und als RPI_BOOT_MEDIA in die initramfs-Konfiguration; den Start vom USB macht usbboot.sh (siehe image.disksig).
  storage_type: sd
  hostname: smartheat-gateway

image:
  layer: image-rpios
  boot_part_size: 200%
  # Feste Groesse: v2.8.0 vergroessert die Root-Partition beim ersten Start nicht (kein resize/growpart im Layer).
  root_part_size: 8G
  name: smartheat-gateway
  # Feste MBR-Disk-Signatur (statt random): usbboot.sh erkennt daran die Partitionen des Images am USB (PARTUUID
  # 5348470a-01/-02), damit /dev/disk/by-slot/{boot,system} (cmdline.txt, fstab von image-rpios) auch dort entstehen.
  disksig: "0x5348470a"

# Layer locale-config (v2.8.0, Standard en_GB.UTF-8 / gb / English (UK) / Europe/London; Nutzer-Vorgabe 2026-10-07).
# Die Zeitzone setzt tzdata aus der Vorbelegung (locale-base), die Locale erzeugt locales (beide Pakete aus dem Layer
# smartheat-gateway); den Standard (LANG) setzt locale_default.sh, weil locale-base LANG=C.UTF-8 schreibt.
# rootfs_checks.sh prueft beides.
locale:
  default: de_DE.UTF-8
  keyboard_keymap: de
  keyboard_layout: German
  timezone: Europe/Berlin

layer:
  base: trixie-minbase
  shg: smartheat-gateway

deploy:
  # Standard von v2.8.0, hier ausdruecklich: build.sh erwartet work/deploy-<version>/smartheat-gateway.img.zst
  compression: zstd

shg:
  stage: /stage
