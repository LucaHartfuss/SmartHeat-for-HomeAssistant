# Hardware-Watchdog (GW 6.3, 21): systemd fuettert ihn alle 5 s; haengt das System, setzt er nach 10 s zurueck und die
# Firmware startet [all] (der bestaetigte Slot). RebootWatchdogSec begrenzt den Neustart selbst (Rueckfall hoechstens
# 20 min Probestart-Frist plus 5 min haengender Shutdown).
[Manager]
RuntimeWatchdogSec=10s
RebootWatchdogSec=5min
