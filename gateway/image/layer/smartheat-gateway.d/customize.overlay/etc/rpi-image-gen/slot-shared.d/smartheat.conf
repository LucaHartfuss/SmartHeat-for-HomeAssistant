# Slot-uebergreifende Pfade (image-rota, GW 6.1): sie liegen auf der Partition daten und gelten fuer Slot A und B
# gleich, ein Systemwechsel behaelt sie. Alles andere unter /var ist slot-lokal (der Wechsel setzt es auf den Stand
# des Images). Journal und machine-id regelt image-rota selbst.
Version=1
Path=/var/lib/smartheat
Path=/var/lib/docker
Path=/var/lib/containerd
Path=/var/lib/rauc
Path=/var/lib/systemd/timesync
