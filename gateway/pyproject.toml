[project]
name = "smartheat-gateway"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3", "requests>=2.31,<3", "cryptography>=46,<51", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6,<4", "pyyaml>=6.0,<7", "ruff==0.16.9", "pyright==1.1.414", "vulture==2.16"]

[tool.setuptools.dynamic]
version = {attr = "smartheat_gateway.version.GATEWAY_VERSION"}

[tool.pytest.ini_options]
pythonpath = ["src", "../heizungsbruecke/src", "../heizungsbruecke/testhilfen"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# vulture-Whitelist-Format: nackte Ausdruecke auf dem undefinierten Namen _ (scripts/check.sh, Schritt lint).
"vulture_ausnahmen.py" = ["B018", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["smartheat_core", "smartheat_device", "smartheat_runtime", "smartheat_gateway"]

[tool.pyright]
include = ["src"]
extraPaths = ["../heizungsbruecke/src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
