[project]
name = "smartheat-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3", "requests>=2.31,<3", "cryptography>=46,<51", "segno>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.9", "pyright==1.1.414"]

[tool.pytest.ini_options]
pythonpath = ["src", "../heizungsbruecke/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["smartheat_core", "smartheat_runtime", "smartheat_transport", "smartheat_gateway"]

[tool.pyright]
include = ["src"]
extraPaths = ["../heizungsbruecke/src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
