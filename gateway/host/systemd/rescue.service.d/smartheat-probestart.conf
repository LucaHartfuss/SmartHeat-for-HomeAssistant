# Probestart ohne Updater (GW 6.3, R26): bleibt das neue System im Notfallmodus stehen (Pflicht-Mount scheitert), laufen
# weder Timer noch Updater. Vor der Notfall-Shell prueft das Skript, ob dieser Start ein unbestaetigter Probestart ist,
# und startet dann neu (die Firmware nimmt [all], den alten Slot); ein bestaetigter Start bleibt unberuehrt.
[Service]
ExecStartPre=-/opt/smartheat/probestart-frist sofort
