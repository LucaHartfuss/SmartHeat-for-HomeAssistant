#!/usr/sbin/nft -f
# SmartHeat-Gateway: eigene Tabelle, Docker-Ketten bleiben unberuehrt. Weitergeleiteter Verkehr zu
# Containern laeuft ueber forward (Docker), nicht ueber diese input-Kette.
# prerouting (raw, vor Conntrack und DNAT): Docker 29 laesst Pakete aus dem LAN, die direkt an eine Container-Adresse
# gehen (statische Route auf den Pi), an veroeffentlichten Ports vorbei (GW-Weiterleitung: 8081 /healthz). Der Pool fuer
# alle Compose-Netze steht in docker-daemon.json (default-address-pools, 172.30.0.0/16): von ausserhalb des Hosts
# (nicht lo, nicht Docker-Bruecken) ist dort nichts erreichbar; veroeffentlichte Ports laufen ueber die Host-Adresse
# (DNAT erst danach) und bleiben unberuehrt. Gleiches fuer Loopback-Adressen auf fremden Schnittstellen (route_localnet).
table inet smartheat
delete table inet smartheat
table inet smartheat {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    udp dport { 68, 546 } accept
    # Port 80: Docker veroeffentlicht ihn nur auf IPv4 ("0.0.0.0:80:8080" in der Compose-Datei), auf [::]:80 lauscht
    # nichts. Verbindungen aus dem LAN laufen ueber DNAT/forward (Docker); die Diagnoseseite prueft die Quelladresse
    # selbst.
    tcp dport 80 accept
    @PILOT_SSH@
  }
  chain prerouting {
    type filter hook prerouting priority raw;
    iifname != "lo" ip daddr 127.0.0.0/8 drop
    # Bruecken ausnehmen mit je einer eigenen Regel statt einer Menge { "docker0", "br-*" }: ob ein Platzhalter (*) innerhalb
    # einer Menge als Muster gilt, ist nft-Verhalten, das hier nicht darauf ankommen soll; waere "br-*" dort woertlich gemeint,
    # verwuerfe die Regel allen Verkehr der Compose-Netze und der Stack stuende. Ein einzelner Name mit * ist lange Standard.
    iifname "docker0" return
    iifname "br-*" return
    ip daddr 172.30.0.0/16 drop
  }
}
