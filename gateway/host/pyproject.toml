# Host-Dienste des Gateways: laufen auf dem System-Python des Pi (Debian 13 trixie, 3.13) mit
# Standardbibliothek und python3-cryptography; kein eigenes Paket-Build, install.sh kopiert die Dateien.
[tool.pytest.ini_options]
pythonpath = [".", "tests", "../src", "../tests", "../../heizungsbruecke/src", "../../heizungsbruecke/testhilfen"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# vulture-Whitelist-Format: nackte Ausdruecke auf dem undefinierten Namen _ (scripts/check.sh, Schritt lint).
"vulture_ausnahmen.py" = ["B018", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["smartheat_host", "smartheat_gateway"]

[tool.pyright]
include = ["smartheat_host"]
extraPaths = ["../src", "../../heizungsbruecke/src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
