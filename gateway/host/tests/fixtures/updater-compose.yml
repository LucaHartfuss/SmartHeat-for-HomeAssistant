# Nur fuer tests/test_gateway_updater.sh (Plan G2b-1 Task 15; ab 0.6.0 Plan 5b D2).
# Abgeleitet von gateway/compose/docker-compose.yml: ohne zigbee2mqtt, Netz wan extern (shg-upd-wan, dort laufen der
# Fake-Bootstrap shg-upd-bootstrap, der Fake-Broker und der Updater-Container), runtime ohne ports. Der Bundle-Bau
# (gateway/host/tests/fixtures/make_test_bundles.py) ersetzt build: der Gateway-Dienste durch das Image mit Digest.
# security_opt label:disable: auf SELinux-Hosts (Fedora) duerfen die Container die Bind-Mounts sonst nicht lesen
# (wie docker-compose.dev.yml); ohne SELinux wirkungslos. Ausgeschrieben (ohne Anker) erzeugt mit as_fixture aus
# host/tests/test_fixture_drift.py.
x-hardening:
  read_only: true
  cap_drop:
  - ALL
  security_opt:
  - no-new-privileges:true
  - label:disable
  tmpfs:
  - /tmp
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
x-gateway:
  read_only: true
  cap_drop:
  - ALL
  security_opt:
  - no-new-privileges:true
  - label:disable
  tmpfs:
  - /tmp
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  build:
    context: ../../../..
    dockerfile: gateway/Dockerfile
x-after-init:
  init:
    condition: service_completed_successfully
services:
  init:
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - label:disable
    tmpfs:
    - /tmp
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: ../../../..
      dockerfile: gateway/Dockerfile
    command:
    - python
    - -m
    - smartheat_gateway.init
    network_mode: none
    environment:
      SHG_BUS_DIR: /bus
      SHG_ZIGBEE_DIR: /zigbee2mqtt
      SHG_DATA_DIR: /data
      SHG_HOST_DIR: /host
      ZIGBEE_ADAPTER: ${ZIGBEE_ADAPTER:-ember}
    volumes:
    - ${SHG_ROOT:-/var/lib/smartheat}/bus:/bus
    - ${SHG_ROOT:-/var/lib/smartheat}/zigbee2mqtt:/zigbee2mqtt
    - ${SHG_ROOT:-/var/lib/smartheat}/data:/data
    - ${SHG_ROOT:-/var/lib/smartheat}/host:/host:ro
  runtime:
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - label:disable
    tmpfs:
    - /tmp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: ../../../..
      dockerfile: gateway/Dockerfile
    command:
    - python
    - -m
    - smartheat_gateway.runtime_main
    networks:
    - bus
    - wan
    stop_grace_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    environment:
      SHG_BUS_HOST: mosquitto
      SHG_BUS_CREDENTIALS: /run/shg-bus/bus.json
      SHG_DATA_DIR: /data
      SHG_HOST_DIR: /host
      SHG_DEVICE_API_URL: http://shg-upd-bootstrap:8090
      SHG_PORTAL_BASE_URL: ${SHG_PORTAL_BASE_URL:-}
      SHG_DIAG_HOSTNAMES: ${SHG_DIAG_HOSTNAMES:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
    - ${SHG_ROOT:-/var/lib/smartheat}/data:/data
    - ${SHG_ROOT:-/var/lib/smartheat}/host:/host:ro
    - ${SHG_ROOT:-/var/lib/smartheat}/bus/credentials/runtime:/run/shg-bus:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os,sys,time,urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); sys.exit(time.time()
        - os.path.getmtime('/tmp/shg-runtime-alive') > 120)
      interval: 30s
      timeout: 5s
      retries: 3
  mosquitto:
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    - label:disable
    tmpfs:
    - /tmp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    user: 1000:1000
    networks:
    - bus
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
    - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    - ${SHG_ROOT:-/var/lib/smartheat}/bus/mosquitto:/mosquitto/config/bus:ro
networks:
  bus:
    internal: true
  wan:
    external: true
    name: shg-upd-wan
