# Lokaler Bus des Gateways (Spec SHG G2 6.1, G2b-1 3): nur im internen Compose-Netz "bus", Anmeldung je Dienst,
# ACL vom Init-Schritt (bus/mosquitto), ohne Persistenz.
listener 1883
allow_anonymous false
password_file /mosquitto/config/bus/passwd
acl_file /mosquitto/config/bus/acl
persistence false
log_dest stdout
log_type warning
