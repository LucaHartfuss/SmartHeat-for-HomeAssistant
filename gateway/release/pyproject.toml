# Release-Werkzeug des Gateways (Spec SHG G2b-1 7): baut das Bundle aus der Compose-Datei. Laeuft nur im Release-Workflow
# und in Tests, nicht auf dem Geraet.
# [project] beschreibt nur die Abhaengigkeiten fuer die Lock-Datei requirements.txt (pip install --require-hashes in
# release-gateway.yml, Final-Review FW-3); das Werkzeug selbst wird nie installiert. Versionen wie in
# gateway/requirements.txt (cryptography, cffi, pycparser) und release.yml (pyyaml), geprueft von tests/test_lock.py.
[project]
name = "smartheat-gateway-release"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0,<7", "cryptography>=46,<51"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = [".", "../host", "../src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["build_bundle", "verify_bundle", "smartheat_host", "smartheat_gateway"]

[tool.pyright]
include = ["build_bundle.py", "verify_bundle.py"]
extraPaths = ["../host", "../src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
