# Release-Werkzeug des Gateways (Spec SHG G2b-1 7): baut das Bundle aus der Compose-Datei. Laeuft nur im Release-Workflow
# und in Tests, nicht auf dem Geraet.
[tool.pytest.ini_options]
pythonpath = [".", "../host", "../src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["build_bundle", "smartheat_host", "smartheat_gateway"]

[tool.pyright]
include = ["build_bundle.py"]
extraPaths = ["../host", "../src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
