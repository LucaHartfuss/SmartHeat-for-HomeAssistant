# Lokaler Bus des Gateways: nur im internen Compose-Netz "bus", Anmeldung je Dienst,
# ACL vom Init-Schritt (bus/mosquitto), Persistenz auf bus/mosquitto-daten (retained Nachrichten ueberleben Neustarts).
listener 1883
allow_anonymous false
password_file /mosquitto/config/bus/passwd
acl_file /mosquitto/config/bus/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
