# SmartHeat-Gateway (Spec SHG G2 7.2; ab 0.6.0 Spec 5b 5.3): ein Gateway-Container `runtime` (Geraetekern, Laufzeit,
# Diagnoseseite), dazu Mosquitto als lokaler Bus fuer Zigbee2MQTT. Agent und Tunnel entfallen; der Draht zum Server ist
# MQTT ueber TLS aus dem Container `runtime`. Gateway-Dienste bauen lokal (build:); der Bundle-Bau ersetzt das durch
# image: ...@sha256. Host-Ordner unter ${SHG_ROOT:-/var/lib/smartheat}. Start auf dem Geraet:
#   docker compose -f gateway/compose/docker-compose.yml up -d
# Die Diagnoseseite antwortet nur unter IP-Adressen, localhost und den Namen aus SHG_DIAG_HOSTNAMES (kommagetrennt).
# G2b-1: Dienst init vor allen anderen; Bus mit Anmeldung.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped
  # Logs ins Journal des Hosts (L4-18): Groesse, Rotation und der Schreibtakt von journald.conf.d/smartheat.conf gelten
  # auch hier, und ein Stromausfall laesst keine beschaedigte json-Datei zurueck, an der `docker logs` scheitert.
  # Lesen: `docker logs <Dienst>` oder `journalctl CONTAINER_NAME=<Dienst>`.
  logging:
    driver: journald
    options: {tag: "{{.Name}}"}

x-gateway: &gateway
  <<: *hardening
  build:
    context: ../..
    dockerfile: gateway/Dockerfile

x-after-init: &after-init
  init: {condition: service_completed_successfully}

services:
  # Einmaliger Schritt vor allen anderen (Spec G2b-1 3): schreibt Bus-Zugangsdaten, Passwortdatei, ACL, die
  # Zigbee2MQTT-Grundkonfiguration und legt data/device an. Ohne Netz.
  init:
    <<: *gateway
    restart: "no"
    command: ["python", "-m", "smartheat_gateway.init"]
    network_mode: none
    environment:
      SHG_BUS_DIR: /bus
      SHG_ZIGBEE_DIR: /zigbee2mqtt
      SHG_DATA_DIR: /data
      SHG_HOST_DIR: /host
      ZIGBEE_ADAPTER: ${ZIGBEE_ADAPTER:-ember}
    volumes:
      - ${SHG_ROOT:-/var/lib/smartheat}/bus:/bus
      - ${SHG_ROOT:-/var/lib/smartheat}/zigbee2mqtt:/zigbee2mqtt
      - ${SHG_ROOT:-/var/lib/smartheat}/data:/data
      - ${SHG_ROOT:-/var/lib/smartheat}/host:/host:ro

  runtime:
    <<: *gateway
    command: ["python", "-m", "smartheat_gateway.runtime_main"]
    networks: [bus, wan]
    ports: ["80:8080"]
    # Beim Ende trennt der Prozess den Link sauber (MQTT-DISCONNECT) und wartet bis zu 10 s auf den Geraete-Thread
    # (runtime_main.JOIN_SECONDS); Dockers Standard-Frist von 10 s kaeme mit SIGKILL zuvor.
    stop_grace_period: 20s
    depends_on:
      <<: *after-init
      mosquitto: {condition: service_started}
    environment:
      SHG_BUS_HOST: mosquitto
      SHG_BUS_CREDENTIALS: /run/shg-bus/bus.json
      SHG_DATA_DIR: /data
      SHG_HOST_DIR: /host
      SHG_DEVICE_API_URL: ${SHG_DEVICE_API_URL:?SHG_DEVICE_API_URL fehlt}
      SHG_PORTAL_BASE_URL: ${SHG_PORTAL_BASE_URL:-}
      SHG_DIAG_HOSTNAMES: ${SHG_DIAG_HOSTNAMES:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${SHG_ROOT:-/var/lib/smartheat}/data:/data
      - ${SHG_ROOT:-/var/lib/smartheat}/host:/host:ro
      - ${SHG_ROOT:-/var/lib/smartheat}/bus/credentials/runtime:/run/shg-bus:ro
    healthcheck:
      # Seite antwortet (Host 127.0.0.1: fremde Host-Namen bekommen 403) und der Regel-Worker lebt (Wache alle 30 s).
      test: ["CMD", "python", "-c", "import os,sys,time,urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); sys.exit(time.time() - os.path.getmtime('/tmp/shg-runtime-alive') > 120)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    # uid 1000 besitzt bus/mosquitto (init schreibt passwd und acl mit 0600); Mosquitto 2 verweigert fremde Dateien.
    user: "1000:1000"
    networks: [bus]
    depends_on: *after-init
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${SHG_ROOT:-/var/lib/smartheat}/bus/mosquitto:/mosquitto/config/bus:ro

  zigbee2mqtt:
    <<: *hardening
    # Zigbee2MQTT 2.14.2 (Index-Digest, amd64 + arm64). Lauf mit Stick erst in G2b (Hardware-Gate).
    # Gleiche uid wie das Gateway-Image: der Init-Schritt schreibt configuration.yaml mit 0600, Zigbee2MQTT liest und
    # ersetzt sie (GENERATE). Kein retain fuer Geraete (z2m_config).
    image: koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
    user: "1000:1000"
    group_add: [dialout]
    networks: [bus]
    depends_on:
      <<: *after-init
      mosquitto: {condition: service_started}
    devices: ["/dev/zigbee:/dev/zigbee"]
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${SHG_ROOT:-/var/lib/smartheat}/zigbee2mqtt:/app/data

networks:
  bus:
    internal: true
  wan: {}
