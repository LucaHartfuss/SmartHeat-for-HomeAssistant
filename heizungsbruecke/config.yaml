name: "Heizungsbruecke"
version: "1.1.0"
slug: "heizungsbruecke"
description: "SmartHeat-Gerät für Home Assistant: verbindet die Heizung über die SmartHeat-Integration mit dem SmartHeat-Dienst; Sicherheit, Boost und Notbetrieb bleiben lokal."
url: "https://github.com/LucaHartfuss/SmartHeat-for-HomeAssistant"
arch:
  - aarch64
  - amd64
startup: services
homeassistant_api: true
hassio_api: true
discovery:
  - smartheat
# Lokaler Befehl der Integration, nur `entfernen <geraet_id>` (stdin_befehl.py)
stdin: true
# Nur Optionen zum Starten: bootstrap_url (Standard: Produktions-URL der Accounts-API, nur fuer
# Labor und Tests setzen) und log_level. Zuordnung, Zugang und Intervalle kommen als Konfigurationsdokument vom Server;
# die Integration schreibt keine Optionen. bootstrap_url nur https; http nur ueber die Umgebung
# SMARTHEAT_BOOTSTRAP_URL (E2E).
schema:
  bootstrap_url: "match(^https://.+)?"
  log_level: list(debug|info|warning|error)?
