name: "Heizungsbruecke"
version: "0.8.0"
slug: "heizungsbruecke"
description: "Generische Bruecken-Logik: liest konfigurierte HA-Entities, meldet sie an den SmartHeat-Server, schreibt Sollwerte zurueck, mit lokalem Boost-Failsafe und Sicherheits-Clamps."
url: "https://github.com/LucaHartfuss/SmartHeat-for-HomeAssistant"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
homeassistant_api: true
options:
  tenant_id: ""
  profile: ""
  mqtt_username: ""
  mqtt_password: ""
  entity_room_actual: ""
  entity_room_target: ""
  entity_curve_current: ""
  entity_offset_current: ""
  entity_outdoor_temp: ""
  entity_heat_limit: ""
  poll_interval_seconds: 3600
  notify_service: ""
  failsafe_stale_after_hours: 4.0
# poll_interval_seconds/notify_service/failsafe_stale_after_hours must stay optional (`?`):
# the smartheat integration's config_flow.py only ever sends the 8 fields above (tenant_id,
# profile, entity_*) -- Supervisor validates a set-options call against the whole schema, and
# a missing required field fails the call the same way an unknown one does, just silently
# (no "does not exist" warning, straight into AddonError). __main__.py already falls back to
# its own Python-level defaults for these three via options.get(...), so making them optional
# here changes nothing at runtime.
schema:
  tenant_id: str
  profile: str
  mqtt_username: str
  mqtt_password: password
  entity_room_actual: str
  entity_room_target: str
  entity_curve_current: str
  entity_offset_current: str
  entity_outdoor_temp: str
  entity_heat_limit: str
  poll_interval_seconds: int?
  notify_service: str?
  failsafe_stale_after_hours: float(0.1,)?
