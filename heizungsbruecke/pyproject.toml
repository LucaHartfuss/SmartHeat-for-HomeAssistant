[project]
name = "heizungsbruecke"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3", "requests>=2.31,<3", "websocket-client>=1.8,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0,<7", "jinja2>=3.1,<4", "ruff==0.16.9", "pyright==1.1.414"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
