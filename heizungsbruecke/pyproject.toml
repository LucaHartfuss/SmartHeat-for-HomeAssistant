[project]
name = "heizungsbruecke"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
