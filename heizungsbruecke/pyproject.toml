[project]
name = "heizungsbruecke"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3", "requests>=2.31,<3", "websocket-client>=1.8,<2", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6,<4", "pyyaml>=6.0,<7", "jinja2>=3.1,<4", "ruff==0.16.9", "pyright==1.1.414", "vulture==2.16"]

[tool.pytest.ini_options]
pythonpath = ["src", "testhilfen"]
testpaths = ["tests"]
markers = [
    "ws: WebSocket-Clienttests mit 1 s Abbau je Test; check_all.sh --schnell laesst sie aus, check.sh und CI nicht",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# vulture-Whitelist-Format: nackte Ausdruecke auf dem undefinierten Namen _ (scripts/check.sh, Schritt lint).
"vulture_ausnahmen.py" = ["B018", "F821"]
# Fixture `env` aus test_runtime importiert (pytest registriert sie unter dem Attributnamen).
"tests/test_audit_robustheit.py" = ["F811"]
"tests/test_host.py" = ["F811"]
"tests/test_realistic_ha.py" = ["F811"]
"tests/test_runtime_plan3b.py" = ["F811"]
"tests/test_runtime_geraetepfad.py" = ["F811"]
"tests/test_host_dokument.py" = ["F811"]
"tests/test_geraet_host.py" = ["F811"]
"tests/test_main_geraet.py" = ["F811"]
"tests/test_main.py" = ["F811"]
"tests/test_app_config_error_boost.py" = ["F811"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
